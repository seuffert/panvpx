# TODO: Replace this base image with a custom image that has libvpx-dev pre-installed
# to eliminate the apt-get install step on every run and save ~1-2 min per pipeline.
# Example Dockerfile:
#   FROM eclipse-temurin:25-jdk-resolute
#   RUN apt-get update && apt-get install -y libvpx-dev && rm -rf /var/lib/apt/lists/*
# Push it to the GitLab Container Registry and reference it here.
image: eclipse-temurin:25-jdk-resolute

variables:
  # Move the Gradle User Home into the project directory so it falls under GitLab's
  # cache paths and is persisted across runs.
  GRADLE_USER_HOME: ".gradle"
  # Disable the Gradle daemon — ephemeral containers are thrown away after each job
  # so a persistent daemon process is pure overhead.
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

  # Maven Central credentials and GPG signing key — set these as masked
  # CI/CD variables in GitLab (Settings → CI/CD → Variables):
  #   ORG_GRADLE_PROJECT_mavenCentralUsername   — Central Portal token username
  #   ORG_GRADLE_PROJECT_mavenCentralPassword   — Central Portal token password
  #   ORG_GRADLE_PROJECT_signingInMemoryKeyId   — last 8 chars of GPG key ID
  #   ORG_GRADLE_PROJECT_signingInMemoryKeyPassword — GPG passphrase
  #   MAVEN_SIGNING_KEY_BASE64                  — base64-encoded armored private key
  #     GitLab masked variables cannot contain whitespace, so the key must be
  #     base64-encoded. Obtain with:
  #       gpg --export-secret-keys --armor <KEY_FINGERPRINT> | base64 -w0

# Avoid duplicate pipelines — only run for MRs, pushes to main, and tags.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

cache:
  # Cache 1: Gradle wrapper binary.
  # Keyed by the checksum of gradle-wrapper.properties so it is automatically
  # refreshed when the Gradle version is bumped and shared across all branches
  # (the same wrapper version is used everywhere).
  - key:
      files:
        - gradle/wrapper/gradle-wrapper.properties
    paths:
      - .gradle/wrapper
    policy: pull-push

  # Cache 2: Resolved dependency jars + Gradle task-output build cache.
  # The build cache (.gradle/build-cache) is the most critical path here:
  # it stores compiled class files, static-analysis results, test outputs, etc.
  # Without it, org.gradle.caching=true in gradle.properties has no effect in CI
  # because the directory is discarded after every job.
  #
  # Key strategy: branch slug so each branch gets its own warm cache, with a
  # fallback to the main branch cache so new MR branches start warm, not cold.
  - key: "$CI_COMMIT_REF_SLUG-gradle"
    fallback_keys:
      - "$CI_DEFAULT_BRANCH-gradle"
    paths:
      - .gradle/caches
      - .gradle/build-cache
    policy: pull-push

before_script:
  # Install the native libvpx library required by the Project Panama FFI bindings.
  # Once the custom Docker image above is in use, remove these two lines.
  - apt-get update -q -y && apt-get install -q -y libvpx-dev

stages:
  - build-and-test
  - release

# Build and test are intentionally combined into one job.
# Splitting them would spin up a second container, re-extract the cache, and
# pass artifacts between stages — easily doubling consumed CI minutes.
build_and_test:
  stage: build-and-test
  interruptible: true  # Cancel stale pipelines automatically when a new push arrives
  script:
    - ./gradlew build --continue
  artifacts:
    when: always
    reports:
      junit: "**/build/test-results/test/**/TEST-*.xml"
    paths:
      - "**/build/reports/"
      - "**/build/libs/"

# Create a GitLab Release automatically when a vX.Y.Z tag pipeline succeeds.
# Uses release-cli directly in the script so we can strip the 'v' prefix from
# CI_COMMIT_TAG to match the JAR filename produced by Gradle (e.g. v0.1.0 → 0.1.0).
create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  before_script: []  # Override global before_script — libvpx is not needed here
  cache: []          # No Gradle cache needed for the release job
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  needs:
    - job: build_and_test
      artifacts: false  # We only need build_and_test to succeed; artifacts are linked by URL
  script:
    - RELEASE_VERSION="${CI_COMMIT_TAG#v}"
    - |
      release-cli create \
        --name "Release $CI_COMMIT_TAG" \
        --tag-name "$CI_COMMIT_TAG" \
        --description "See [CHANGELOG](${CI_PROJECT_URL}/-/blob/${CI_COMMIT_TAG}/CHANGELOG.md) for details." \
        --assets-link "{\"name\":\"panvpx-${RELEASE_VERSION}.jar\",\"url\":\"${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/lib/build/libs/panvpx-${RELEASE_VERSION}.jar?job=build_and_test\"}"

# ---------------------------------------------------------------------------
# Publish to Maven Central — version tags only
# ---------------------------------------------------------------------------
# Only runs when all five signing/credentials variables are present so that
# the job is cleanly skipped on forks or when the secrets are not configured.
publish_to_maven_central:
  stage: release
  needs:
    - job: build_and_test
      artifacts: true
    - job: create_release
  rules:
    - if: "$CI_COMMIT_TAG =~ /^v\\d+\\.\\d+\\.\\d+$/ && $ORG_GRADLE_PROJECT_mavenCentralUsername && $ORG_GRADLE_PROJECT_mavenCentralPassword && $MAVEN_SIGNING_KEY_BASE64 && $ORG_GRADLE_PROJECT_signingInMemoryKeyId && $ORG_GRADLE_PROJECT_signingInMemoryKeyPassword"
  script:
    # Decode the base64-encoded armored key into the env var that Gradle reads
    # as the signingInMemoryKey project property. Storing it base64-encoded
    # avoids GitLab's masked-variable whitespace restriction.
    - export ORG_GRADLE_PROJECT_signingInMemoryKey=$(echo "$MAVEN_SIGNING_KEY_BASE64" | base64 -d)
    - ./gradlew publishAndReleaseToMavenCentral --no-daemon --build-cache
